name: CI - Schema & Pipeline Verification
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify Pydantic Schemas & FastAPI App
        env:
          GOOGLE_API_KEY: "dummy_ci_key"
          TAVILY_API_KEY: "dummy_ci_key"
        run: |
          python -c "from app.schemas.models import InboundLead, ExtractedLeadData, ProposalDraft; print('Schemas OK')"
          python -c "from app.api.main import app; print('FastAPI App OK')"
